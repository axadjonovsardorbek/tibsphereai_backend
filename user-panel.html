<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TibSphereAI — User App (Review UI)</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#0b1420; --panel:#0f1f2e; --panel2:#15293c; --border:#233b52;
    --text:#e6f1f8; --muted:#8fa9bd; --accent:#14b8a6; --accent2:#0d9488;
    --ok:#22c55e; --danger:#ef4444; --warn:#f59e0b;
    font-size:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  a{color:var(--accent)}
  button{cursor:pointer;font-family:inherit}
  input,select,textarea{font-family:inherit;background:#081019;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 9px}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--accent)}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 12px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent2);color:#04211c}
  button.primary:hover{background:var(--accent2);color:#fff}
  button.danger{background:#3a1414;border-color:var(--danger);color:#fca5a5}
  button.ok{background:#0f2e1c;border-color:var(--ok);color:#86efac}
  button.sm{padding:4px 8px;font-size:12px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .hidden{display:none!important}

  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .loginBox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px;width:380px;max-width:100%}
  .loginBox h1{font-size:18px;margin:0 0 4px}
  .loginBox p{color:var(--muted);margin:0 0 18px;font-size:12px}
  .tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--border)}
  .tabs button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 4px;color:var(--muted)}
  .tabs button.active{color:var(--text);border-bottom-color:var(--accent)}
  .field{margin-bottom:12px;display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted)}
  .field input,.field select,.field textarea{width:100%}
  #loginErr{color:#fca5a5;font-size:12px;min-height:16px}
  #otpStep2{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}

  #app{display:none;min-height:100vh;grid-template-columns:210px 1fr;grid-template-rows:52px 1fr;}
  #app.show{display:grid}
  #topbar{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);background:var(--panel)}
  #topbar .brand{font-weight:700}
  #topbar .right{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  #sidebar{border-right:1px solid var(--border);background:var(--panel);overflow-y:auto;padding:10px}
  #sidebar .grp{margin:10px 6px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  #sidebar button.nav{display:block;width:100%;text-align:left;background:transparent;border:none;border-radius:6px;padding:8px 10px;color:var(--text);margin-bottom:2px}
  #sidebar button.nav:hover{background:var(--panel2)}
  #sidebar button.nav.active{background:var(--accent);color:#04211c;font-weight:600}
  #main{padding:18px;overflow-y:auto}

  h2.pageTitle{margin:0 0 4px}
  .pageDesc{color:var(--muted);font-size:12px;margin:0 0 16px}
  h3.secTitle{margin:22px 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
  .toolbar .field{margin:0;min-width:130px}

  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  thead th{background:var(--panel2);text-align:left;padding:8px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top;max-width:280px;overflow:hidden;text-overflow:ellipsis}
  tbody tr:hover{background:#0d1c2a}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--panel2);border:1px solid var(--border)}
  .pager{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:10px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .1s}
  .card:hover{border-color:var(--accent)}
  .card h4{margin:0 0 6px;font-size:14px}
  .card p{margin:0;font-size:12px;color:var(--muted)}
  .card .v{font-size:22px;font-weight:700}
  .card.stat{cursor:default}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}

  .modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:10px;width:560px;max-width:100%;padding:18px}
  .modal h3{margin:0 0 12px}
  .formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .formGrid .full{grid-column:1/3}
  .modalFooter{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

  #toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
  .toast{background:var(--panel2);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:6px;padding:10px 14px;font-size:13px;max-width:340px}
  .toast.err{border-left-color:var(--danger)}
  .toast.ok{border-left-color:var(--ok)}

  .breadcrumb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-size:12px}
  .breadcrumb button{padding:3px 8px;font-size:12px}

  .muted{color:var(--muted)}
  .kv{display:flex;flex-direction:column;gap:6px;font-size:13px}
  .kv div span.k{color:var(--muted);display:inline-block;min-width:160px}
  .healthbar{height:10px;border-radius:6px;background:#1a2f42;overflow:hidden;border:1px solid var(--border)}
  .healthbar .fill{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e)}
  .eventLog{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;margin-top:10px}
  .eventItem{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px}
  .eventItem.correct{border-left:4px solid var(--ok)}
  .eventItem.wrong{border-left:4px solid var(--danger)}
  code.small{font-size:11px;color:var(--muted)}
  .subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .subtabs button.active{background:var(--accent);color:#04211c}

  /* ============================================================
     MOBILE APP SHELL (reference: medicai-mvp.vercel.app)
     ============================================================ */
  :root{
    --doc1:#22d3ee; --doc2:#3b82f6;
    --cit1:#fb923c; --cit2:#ef4444;
    --cardbg:#0e1c2b; --cardbg2:#0c1826;
  }
  #shell{display:none;max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:78px}
  #shell.show{display:block}
  #shellContent{padding:14px 14px 8px}

  .topProfile{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:10px 14px;margin-bottom:16px}
  .topProfile .who{display:flex;align-items:center;gap:10px}
  .avatarCircle{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--doc1),var(--doc2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#04212f;flex-shrink:0}
  .who .name{font-weight:700;display:flex;align-items:center;gap:6px}
  .lvlPill{font-size:10px;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:1px 7px;color:var(--muted)}
  .who .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .topRight{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .statPill{font-size:11px;font-weight:600;border-radius:999px;padding:4px 9px;white-space:nowrap;border:1px solid var(--border)}
  .statPill.coins{background:#2a1f08;color:#fbbf24;border-color:#7a5a12}
  .statPill.limit{background:#0b2a24;color:#5eead4;border-color:#0f5e52}

  .heroBox{text-align:center;padding:10px 8px 20px}
  .heroIcon{width:64px;height:64px;border-radius:18px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:28px}
  .heroBox h1{font-size:21px;margin:0 0 8px}
  .heroBox p{color:var(--muted);font-size:13px;margin:0;line-height:1.5}

  .modeToggle{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
  .modeBtn{flex:1;border:none;border-radius:11px;padding:11px 6px;font-size:13px;font-weight:600;background:transparent;color:var(--muted);transition:all .15s}
  .modeBtn.active.doctor{background:linear-gradient(90deg,var(--doc2),var(--doc1));color:#04212f;box-shadow:0 4px 14px -4px rgba(59,130,246,.6)}
  .modeBtn.active.citizen{background:linear-gradient(90deg,var(--cit2),var(--cit1));color:#2b0d02;box-shadow:0 4px 14px -4px rgba(239,68,68,.6)}
  .modeBtn:disabled{opacity:.4;cursor:not-allowed}

  .stepCard{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
  .stepLabelRow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .stepLabel{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
  .modeTag{font-size:10px;font-weight:700;border-radius:999px;padding:3px 9px}
  .modeTag.doctor{background:#0d2a3d;color:#7dd3fc;border:1px solid #164e63}
  .modeTag.citizen{background:#3a1607;color:#fdba74;border:1px solid #7c2d12}
  .stepCard select{width:100%;padding:11px 10px;font-size:13px;border-radius:10px}
  .stepCard + .stepCard{margin-top:-6px}

  .pillGroup{display:flex;gap:8px;margin-top:4px}
  .pillGroup button{flex:1;padding:11px 4px;border-radius:10px;font-size:13px;font-weight:600;background:var(--panel2);border:1px solid var(--border);color:var(--text)}
  .pillGroup button.active{border-color:#f59e0b;color:#fbbf24;background:#241a06}

  .ctaBtn{width:100%;padding:16px;border:none;border-radius:14px;font-size:15px;font-weight:700;color:#04212f;background:linear-gradient(90deg,var(--doc1),var(--doc2));box-shadow:0 8px 22px -6px rgba(34,211,238,.55);display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px}
  .ctaBtn.citizen{color:#2b0d02;background:linear-gradient(90deg,var(--cit1),var(--cit2));box-shadow:0 8px 22px -6px rgba(239,68,68,.55)}
  .ctaBtn:disabled{opacity:.55;box-shadow:none}

  .promoCard{border-radius:14px;padding:14px;background:linear-gradient(120deg,#3a2306,#1c1206);border:1px solid #6b4a10;display:flex;gap:10px;align-items:flex-start}
  .promoCard .tag{font-size:9px;font-weight:700;color:#fbbf24;background:#2a1a04;border:1px solid #7a5a12;border-radius:5px;padding:2px 6px}
  .promoCard .sub{font-size:10px;color:var(--muted);margin-left:6px}
  .promoCard p{margin:6px 0 0;font-size:12px;font-weight:600}
  .promoCard .ic{font-size:22px}

  #bottomNav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;background:var(--panel);border-top:1px solid var(--border);padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px)}
  #bottomNav button{flex:1;background:transparent;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:11px;border-radius:10px}
  #bottomNav button .ic{font-size:19px}
  #bottomNav button.active{color:var(--accent)}

  /* ---------- Simulyatsiya ekrani ---------- */
  #simView{display:none;position:fixed;inset:0;background:var(--bg);z-index:40;flex-direction:column;max-width:480px;margin:0 auto}
  #simView.show{display:flex}
  .simTopbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--panel)}
  .simTopbar .ttl{font-weight:700;font-size:14px}
  .simTopbar .sub{font-size:11px;color:var(--muted)}
  .simIconBtn{width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
  .simBody{flex:1;overflow-y:auto;padding:12px 14px 4px;display:flex;flex-direction:column;gap:12px}

  .statusRow{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:600}
  .statusRow .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
  .statusRow.warn .dot{background:var(--warn)} .statusRow.warn{color:#fbbf24}
  .statusRow.critical .dot{background:var(--danger);animation:blink 1s infinite} .statusRow.critical{color:#fca5a5}
  .statusRow.flat .dot{background:#f87171;animation:blink .6s infinite} .statusRow.flat{color:#f87171}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  .avatarStage{display:flex;flex-direction:column;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px 8px}
  .avatarFig{width:96px;height:120px}
  .avatarFig .breathe{transform-origin:center;animation:breathe 3s ease-in-out infinite}
  .avatarFig.severity-mid .breathe{animation-duration:1.6s}
  .avatarFig.severity-high .breathe{animation-duration:.9s}
  .avatarFig.seizure{animation:shake .25s linear infinite}
  .avatarFig.flatline .breathe{animation:none;opacity:.55}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  /* Yuz ifodasi - health_percent tushgan sari (severity-mid/high/flatline) og'iz/qosh
     shakli o'zgaradi, bemor holati 100% deb "muzlab" qolmasligi uchun. */
  .avatarFig .mouth-mid, .avatarFig .mouth-high, .avatarFig .brow{display:none}
  .avatarFig.severity-mid .mouth-normal, .avatarFig.severity-high .mouth-normal, .avatarFig.flatline .mouth-normal{display:none}
  .avatarFig.severity-mid .mouth-mid{display:inline}
  .avatarFig.severity-high .mouth-high, .avatarFig.flatline .mouth-high{display:inline}
  .avatarFig.severity-mid .brow, .avatarFig.severity-high .brow, .avatarFig.flatline .brow{display:inline}
  @keyframes shake{0%{transform:translateX(-2px) rotate(-1deg)}50%{transform:translateX(2px) rotate(1deg)}100%{transform:translateX(-2px) rotate(-1deg)}}
  .ecgWrap{width:100%;height:44px;overflow:hidden;margin-top:10px;border-radius:8px;background:#050c14}
  .ecgWrap svg{width:200%;height:100%;animation:ecgScroll 2.4s linear infinite}
  .ecgWrap.flat svg{animation:none}
  @keyframes ecgScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .avatarMeta{display:flex;justify-content:space-between;width:100%;font-size:11px;color:var(--muted);margin-top:8px}
  .avatarMeta b{color:var(--text);font-size:13px}

  .barRow{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
  .barRow .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .barRow .lbl b{color:var(--text);font-size:12px}
  .miniBar{height:8px;border-radius:5px;background:#1a2f42;overflow:hidden}
  .miniBar .fill{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e);transition:width .4s}

  .vitalsGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .vitalCard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:9px 12px;display:flex;align-items:center;gap:8px}
  .vitalCard .ic{font-size:16px}
  .vitalCard .v{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  .vitalCard .l{font-size:10px;color:var(--muted)}
  .vitalCard.alert{border-color:var(--danger)}

  .chatLog{display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
  .msg{max-width:86%;font-size:13px;line-height:1.45;border-radius:14px;padding:10px 13px}
  .msg.sys{align-self:center;max-width:96%;text-align:center;background:transparent;border:1px dashed var(--border);color:var(--muted);font-size:11px}
  .msg.sys b{color:var(--accent);display:block;font-size:10px;letter-spacing:.05em;margin-bottom:3px}
  .msg.patient{align-self:flex-start;background:var(--panel2);border:1px solid var(--border);border-bottom-left-radius:4px}
  .msg.doctor{align-self:flex-end;background:linear-gradient(90deg,var(--doc2),var(--doc1));color:#04212f;font-weight:500;border-bottom-right-radius:4px}
  .msg.err{align-self:flex-start;background:#2a1010;border:1px solid var(--danger);color:#fca5a5}
  .replayBtn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:6px;padding:0;vertical-align:middle;border-radius:50%;background:transparent;border:1px solid var(--border);font-size:11px;line-height:1;cursor:pointer}
  .replayBtn:hover{border-color:var(--accent);background:var(--panel)}
  .msg.typing{display:flex;gap:4px;align-items:center;padding:12px 16px}
  .msg.typing .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typingDot 1.1s infinite ease-in-out}
  .msg.typing .dot:nth-child(2){animation-delay:.15s}
  .msg.typing .dot:nth-child(3){animation-delay:.3s}
  @keyframes typingDot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  #simMsgInput:disabled, .simInputBar button:disabled{opacity:.5}

  .simInputBar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--panel)}
  .simInputBar input{flex:1;border-radius:999px;padding:10px 14px}
  .simInputBar button.round{width:38px;height:38px;border-radius:50%;padding:0;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .simInputBar button.round.recording{background:var(--danger);border-color:var(--danger);animation:micPulse 1s ease-in-out infinite}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
  .eventPicker{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}
  .eventPicker button{flex-shrink:0;font-size:11px;padding:6px 10px;border-radius:999px;background:var(--panel2)}
  .eventPicker button.active{background:var(--accent);color:#04211c;border-color:var(--accent2)}
</style>
</head>
<body>

<!-- ================= LOGIN / REGISTER ================= -->
<div id="loginScreen">
  <div class="loginBox">
    <h1>🩺 TibSphereAI</h1>
    <p>Foydalanuvchi ilovasi — review UI. /mobile/* API'larga ulanadi.</p>
    <div class="field">
      <label>Backend Base URL</label>
      <input id="baseUrlInput" value="https://dev-medic.axadjonovsardorbek.uz">
    </div>

    <div class="tabs">
      <button id="tabOtp" class="active" onclick="switchAuthTab('otp')">📱 OTP (email/telegram)</button>
      <button id="tabGoogle" onclick="switchAuthTab('google')">🔵 Google</button>
    </div>

    <div id="otpPane">
      <div class="field">
        <label>Identifikator (email yoki telefon)</label>
        <input id="identifierInput" placeholder="user@mail.com yoki +998901234567">
      </div>
      <div class="field">
        <label>Kanal turi</label>
        <select id="otpTypeInput">
          <option value="email">email</option>
          <option value="telegram">telegram</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button onclick="checkAccount()" style="flex:1">🔍 Hisobni tekshirish</button>
        <button class="primary" onclick="sendOtp()" style="flex:1">✉️ Kod yuborish</button>
      </div>
      <div id="otpStep2" class="hidden">
        <div class="field">
          <label>Tasdiqlash kodi</label>
          <input id="otpCodeInput" placeholder="123456">
        </div>
        <button class="primary" style="width:100%" onclick="confirmOtp()">✅ Tasdiqlash va kirish</button>
      </div>
    </div>

    <div id="googlePane" class="hidden">
      <div class="field">
        <label>Google Client ID</label>
        <input id="googleClientIdInput" value="439240484061-ujut1a9arhm8q83d3dsga7ruhfrjpcmf.apps.googleusercontent.com">
      </div>
      <div id="googleBtnDiv" style="display:flex;justify-content:center;margin:10px 0;min-height:40px"></div>

<script>
/* ============================================================
   STATE + CORE
   ============================================================ */
const state = {
  baseUrl: localStorage.getItem('tu_base') || 'https://dev-medic.axadjonovsardorbek.uz',
  access: localStorage.getItem('tu_access') || '',
  refresh: localStorage.getItem('tu_refresh') || '',
  uid: localStorage.getItem('tu_uid') || '',
  lang: localStorage.getItem('tu_lang') || 'uz',
  activeSession: JSON.parse(localStorage.getItem('tu_active_session') || 'null'),
};

function toast(msg, kind){
  const wrap = document.getElementById('toasts');
  // Bir xil matn+tur bilan toast allaqachon ko'rinib turgan bo'lsa (masalan
  // tugma bir necha marta ketma-ket bosilsa), uni yangilab qayta boshlaymiz -
  // bir xil xabar ustma-ust uyilib qolmaydi.
  const dupSelector = '.toast[data-msg="'+CSS.escape(msg)+'"][data-kind="'+CSS.escape(kind || '')+'"]';
  const existing = wrap.querySelector(dupSelector);
  if(existing){
    clearTimeout(existing._toastTimer);
    existing._toastTimer = setTimeout(()=>existing.remove(), kind === 'err' ? 9000 : 4500);
    return;
  }

  const box = document.createElement('div');
  box.className = 'toast ' + (kind || '');
  box.textContent = msg;
  box.dataset.msg = msg;
  box.dataset.kind = kind || '';
  wrap.appendChild(box);
  // Xato xabarlari (ayniqsa validatsiya tafsilotlari bilan) uzunroq bo'lishi
  // mumkin - o'qib ulgurish uchun ko'proq vaqt beramiz.
  box._toastTimer = setTimeout(()=>box.remove(), kind === 'err' ? 9000 : 4500);
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// refreshInFlight - bir vaqtda ko'p so'rov 401 olsa ham, refresh faqat bir marta
// chaqirilsin uchun (parallel so'rovlar shu bitta promise'ni kutadi).
let refreshInFlight = null;
async function doRefreshToken(){
  if(!state.refresh) return false;
  if(!refreshInFlight){
    refreshInFlight = (async ()=>{
      try{
        const res = await fetch(state.baseUrl.replace(/\/$/,'') + '/auth/token/refresh', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({refresh_token: state.refresh}),
        });
        if(!res.ok) return false;
        const data = await res.json();
        if(!data || !data.access_token) return false;
        state.access = data.access_token;
        state.refresh = data.refresh_token || state.refresh;
        localStorage.setItem('tu_access', state.access);
        localStorage.setItem('tu_refresh', state.refresh);
        return true;
      }catch(e){ return false; }
    })();
  }
  const ok = await refreshInFlight;
  refreshInFlight = null;
  return ok;
}

async function api(path, {method='GET', body=null, isForm=false, query=null, silent=false} = {}, _retry=true){
  let url = state.baseUrl.replace(/\/$/,'') + path;
  if(query){
    const qs = Object.entries(query).filter(([,v])=>v!==undefined && v!==null && v!=='').map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
    if(qs) url += (url.includes('?')?'&':'?') + qs;
  }
  const headers = {'Accept-Language': state.lang};
  if(state.access) headers['Authorization'] = 'Bearer ' + state.access;
  let fetchBody;
  if(isForm){ fetchBody = body; }
  else if(body !== null && body !== undefined){ headers['Content-Type']='application/json'; fetchBody = JSON.stringify(body); }
  let res;
  try{
    res = await fetch(url, {method, headers, body: fetchBody});
  }catch(e){
    if(!silent) toast('Tarmoq xatosi: ' + e.message, 'err');
    throw e;
  }
  if(res.status === 401 && _retry && state.refresh && path !== '/auth/token/refresh'){
    const ok = await doRefreshToken();
    if(ok) return api(path, {method, body, isForm, query, silent}, false);
    logout();
    if(!silent) toast('Sessiya tugagan, qaytadan kiring', 'err');
    const err = new Error('session expired'); err.status = 401;
    throw err;
  }
  const text = await res.text();
  let data = null;
  try{ data = text ? JSON.parse(text) : null; }catch(e){ data = text; }
  if(!res.ok){
    let msg = 'Xatolik (' + res.status + ')';
    if(data && data.error && data.error.message) msg = data.error.message + (data.error.details ? (' — ' + data.error.details) : '');
    else if(typeof data === 'string' && data) msg = data;
    if(res.status === 401) msg = 'Sessiya tugagan. Qayta kiring. (' + msg + ')';
    if(!silent) toast(msg, 'err');
    const err = new Error(msg); err.status = res.status; err.data = data;
    throw err;
  }
  return data;
}

function extractList(json){
  if(Array.isArray(json)) return {items: json, count: json.length};
  if(json && typeof json === 'object'){
    for(const k of Object.keys(json)){
      if(Array.isArray(json[k])){
        const count = typeof json.total === 'number' ? json.total : (typeof json.count === 'number' ? json.count : json[k].length);
        return {items: json[k], count};
      }
    }
  }
  return {items: [], count: 0};
}
function ml(v){ // multilingual object -> current lang string
  if(v && typeof v === 'object') return v[state.lang] || v.uz || v.ru || v.en || '';
  return v ?? '';
}
function fmtCell(v){
  if(v === null || v === undefined) return '<span class="muted">—</span>';
  if(typeof v === 'boolean') return v ? '✅' : '⬜️';
  if(typeof v === 'object'){
    if(v.uz !== undefined || v.ru !== undefined || v.en !== undefined) return esc(ml(v));
    const s = JSON.stringify(v);
    return '<code class="small" title="'+esc(s)+'">'+esc(s.length>60?s.slice(0,60)+'…':s)+'</code>';
  }
  const s = String(v);
  return esc(s.length>140 ? s.slice(0,140)+'…' : s);
}

/* ============================================================
   GENERIC MODAL / FORM (trimmed version of admin engine)
   ============================================================ */
function buildFormField(container, f, values){
  const wrap = document.createElement('div');
  wrap.className = 'field' + (f.full ? ' full' : '');
  const label = document.createElement('label');
  label.textContent = f.label + (f.required ? ' *' : '');
  wrap.appendChild(label);

  if(f.type === 'textarea' || f.type === 'json'){
    const ta = document.createElement('textarea');
    ta.rows = f.rows || 3;
    let v = values[f.name];
    if(f.type === 'json' && v !== undefined && typeof v === 'object') v = JSON.stringify(v, null, 2);
    ta.value = v ?? '';
    wrap.appendChild(ta);
    wrap._getValue = () => {
      if(f.type === 'json'){
        const raw = ta.value.trim();
        if(!raw) return f.jsonDefault !== undefined ? f.jsonDefault : {};
        try{ return JSON.parse(raw); }catch(e){ throw new Error('"'+f.label+'" JSON xato: ' + e.message); }
      }
      return ta.value;
    };
  } else if(f.type === 'checkbox'){
    const inp = document.createElement('input');
    inp.type='checkbox'; inp.checked = !!values[f.name];
    wrap.style.flexDirection='row'; wrap.style.alignItems='center'; wrap.style.gap='8px';
    wrap.appendChild(inp);
    wrap._getValue = () => inp.checked;
  } else if(f.type === 'select'){
    const sel = document.createElement('select');
    (f.options||[]).forEach(o=>{ const op=document.createElement('option'); op.value=o.value; op.textContent=o.label; sel.appendChild(op); });
    sel.value = values[f.name] ?? (f.options && f.options[0] ? f.options[0].value : '');
    wrap.appendChild(sel);
    wrap._getValue = () => sel.value;
  } else if(f.type === 'file'){
    const inp = document.createElement('input');
    inp.type = 'file'; if(f.accept) inp.accept = f.accept;
    wrap.appendChild(inp);
    wrap._getValue = () => inp.files[0] || null;
  } else {
    const inp = document.createElement('input');
    inp.type = f.type === 'number' ? 'number' : (f.type === 'password' ? 'password' : 'text');
    if(f.step) inp.step = f.step;
    inp.value = values[f.name] ?? '';
    if(f.placeholder) inp.placeholder = f.placeholder;
    wrap.appendChild(inp);
    wrap._getValue = () => f.type === 'number' ? (inp.value===''?0:Number(inp.value)) : inp.value;
  }
  container.appendChild(wrap);
  return wrap;
}

function openModal({title, fields, values, onSubmit, submitLabel}){
  const overlay = document.createElement('div');
  overlay.className = 'modalOverlay';
  overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
  const modal = document.createElement('div'); modal.className = 'modal';
  modal.innerHTML = '<h3>' + esc(title) + '</h3>';
  const grid = document.createElement('div'); grid.className='formGrid';
  const wraps = fields.map(f => buildFormField(grid, f, values || {}));
  modal.appendChild(grid);
  const footer = document.createElement('div'); footer.className='modalFooter';
  const cancelBtn = document.createElement('button'); cancelBtn.textContent='Bekor qilish';
  cancelBtn.onclick = () => overlay.remove();
  const submitBtn = document.createElement('button'); submitBtn.className='primary';
  submitBtn.textContent = submitLabel || 'Saqlash';
  submitBtn.onclick = async () => {
    const out = {};
    try{ fields.forEach((f,i)=> out[f.name] = wraps[i]._getValue()); }
    catch(e){ toast(e.message,'err'); return; }
    submitBtn.disabled = true; const orig = submitBtn.textContent; submitBtn.textContent='...';
    try{ await onSubmit(out); overlay.remove(); }
    catch(e){ submitBtn.disabled=false; submitBtn.textContent=orig; }
  };
  footer.appendChild(cancelBtn); footer.appendChild(submitBtn);
  modal.appendChild(footer);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}
function confirmDialog(msg){ return window.confirm(msg); }

function renderSimpleTable(container, items, columns, rowActionsFn){
  if(!items.length){ container.innerHTML = '<p class="muted">Ma\'lumot topilmadi.</p>'; return; }
  const table = document.createElement('table');
  const thead = document.createElement('thead'); const trh = document.createElement('tr');
  columns.forEach(c=>{ const th=document.createElement('th'); th.textContent=c.label||c.key; trh.appendChild(th); });
  if(rowActionsFn){ const th=document.createElement('th'); th.textContent='Amallar'; trh.appendChild(th); }
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = document.createElement('tbody');
  items.forEach(row=>{
    const tr = document.createElement('tr');
    columns.forEach(c=>{
      const td = document.createElement('td');
      const val = c.get ? c.get(row) : row[c.key];
      td.innerHTML = c.raw ? (val ?? '') : fmtCell(val);
      tr.appendChild(td);
    });
    if(rowActionsFn){
      const td = document.createElement('td');
      const box = document.createElement('div'); box.className='actions';
      rowActionsFn(row).forEach(b=>box.appendChild(b));
      td.appendChild(box); tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  container.innerHTML=''; container.appendChild(table);
}

function switchAuthTab(which){

/* Google Identity Services - haqiqiy Google Sign-In tugmasi, id_token'ni
   qo'lda paste qilishga hojat qoldirmaydi. Muvaffaqiyatli kirishda GIS
   'callback' orqali id_token (credential) qaytaradi, shu bilan bevosita
   /mobile/auth/google chaqiriladi. */
let googleInited = false;
function initGoogleSignIn(){
  const clientId = document.getElementById('googleClientIdInput').value.trim();
  const btnDiv = document.getElementById('googleBtnDiv');
  const hint = document.getElementById('googleHint');
  if(!clientId){ hint.textContent = 'Client ID kiriting'; showGoogleFallback(); return; }
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.id){
    // gsi/client hali yuklanmagan yoki bloklangan - biroz kutib qayta urinamiz
    if(!initGoogleSignIn._retries) initGoogleSignIn._retries = 0;
    if(initGoogleSignIn._retries < 20){ initGoogleSignIn._retries++; setTimeout(initGoogleSignIn, 250); return; }
    hint.textContent = 'Google skripti yuklanmadi (tarmoq/bloklovchi tekshiring)';
    showGoogleFallback();
    return;
  }
  try{
    google.accounts.id.initialize({ client_id: clientId, callback: onGoogleCredential });
    btnDiv.innerHTML = '';
    google.accounts.id.renderButton(btnDiv, { theme:'filled_black', size:'large', width:280, text:'signin_with' });
    hint.textContent = '';
    googleInited = true;
  }catch(e){
    hint.textContent = 'Google tugmasini ishga tushirib bo\'lmadi: ' + e.message;
    showGoogleFallback();
  }
}
function showGoogleFallback(){ document.getElementById('googleFallback').classList.remove('hidden'); }
async function onGoogleCredential(resp){
  document.getElementById('loginErr').textContent='';
  try{
    const res = await rawPost('/mobile/auth/google', {id_token: resp.credential});
    saveSession(res);
  }catch(e){ document.getElementById('loginErr').style.color='#fca5a5'; document.getElementById('loginErr').textContent = e.message; }
}

function curBase(){ return document.getElementById('baseUrlInput').value.trim().replace(/\/$/,''); }

async function rawPost(path, body){
  const res = await fetch(curBase()+path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    const msg = (data && data.error && data.error.message) || 'Xatolik';
    throw new Error(msg);
  }
  return data;
}

async function checkAccount(){
  const identifier = document.getElementById('identifierInput').value.trim();
  document.getElementById('loginErr').textContent='';
  if(!identifier){ document.getElementById('loginErr').textContent='Identifikator kiriting'; return; }
  try{
    const res = await rawPost('/mobile/auth/user/check', {identifier});
    document.getElementById('loginErr').textContent = res.has_account ? '✅ Hisob mavjud — kod yuboring va kiring.' : 'ℹ️ Hisob topilmadi — kod tasdiqlansa avtomatik ro\'yxatdan o\'tasiz.';
    document.getElementById('loginErr').style.color = '#8fa9bd';
  }catch(e){ document.getElementById('loginErr').textContent = e.message; document.getElementById('loginErr').style.color = '#fca5a5'; }
}

async function sendOtp(){
  const identifier = document.getElementById('identifierInput').value.trim();
  const type = document.getElementById('otpTypeInput').value;
  document.getElementById('loginErr').textContent='';
  if(!identifier){ document.getElementById('loginErr').textContent='Identifikator kiriting'; return; }
  try{
    await rawPost('/mobile/auth/user/otp/send', {identifier, type});
    document.getElementById('otpStep2').classList.remove('hidden');
    document.getElementById('loginErr').style.color = '#8fa9bd';
    document.getElementById('loginErr').textContent = 'Kod yuborildi. Pastga kiriting.';
  }catch(e){ document.getElementById('loginErr').style.color='#fca5a5'; document.getElementById('loginErr').textContent = e.message; }
}

async function confirmOtp(){
  const identifier = document.getElementById('identifierInput').value.trim();
  const type = document.getElementById('otpTypeInput').value;
  const confirmation_code = document.getElementById('otpCodeInput').value.trim();
  document.getElementById('loginErr').textContent='';
  try{
    const res = await rawPost('/mobile/auth/user/otp/confirm', {identifier, confirmation_code, type});
    saveSession(res);
  }catch(e){ document.getElementById('loginErr').style.color='#fca5a5'; document.getElementById('loginErr').textContent = e.message; }
}

async function doGoogleLogin(){
  const id_token = document.getElementById('googleTokenInput').value.trim();
  document.getElementById('loginErr').textContent='';
  if(!id_token){ document.getElementById('loginErr').textContent='id_token kiriting'; return; }
  try{
    const res = await rawPost('/mobile/auth/google', {id_token});
    saveSession(res);
  }catch(e){ document.getElementById('loginErr').style.color='#fca5a5'; document.getElementById('loginErr').textContent = e.message; }
}

function saveSession(tokenRes){
  state.baseUrl = curBase();
  state.access = tokenRes.access_token || '';
  state.refresh = tokenRes.refresh_token || '';
  state.uid = tokenRes.id || '';
  localStorage.setItem('tu_base', state.baseUrl);
  localStorage.setItem('tu_access', state.access);
  localStorage.setItem('tu_refresh', state.refresh);
  localStorage.setItem('tu_uid', state.uid);
  startApp();
}

function logout(){
  ['tu_access','tu_refresh','tu_uid','tu_active_session'].forEach(k=>localStorage.removeItem(k));
  state.access=''; state.refresh=''; state.uid=''; state.activeSession=null;
  closeSimView();
  document.getElementById('shell').classList.remove('show');
  document.getElementById('loginScreen').style.display='flex';
}

async function renderProfile(){

async function renderCatalog(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  keysSubnav(main, 'catalog');
  main.insertAdjacentHTML('beforeend', '<h2 class="pageTitle">Bo\'limlar</h2><p class="pageDesc">/mobile/category → /mobile/topic → /mobile/case</p>');
  const crumb = document.createElement('div'); crumb.className='breadcrumb'; main.appendChild(crumb);
  const body = document.createElement('div'); main.appendChild(body);

  const stack = [{level:'category', title:'Bo\'limlar'}];

  function renderCrumbs(){
    crumb.innerHTML='';
    stack.forEach((s,i)=>{
      if(i>0){ const sep=document.createElement('span'); sep.className='muted'; sep.textContent='›'; crumb.appendChild(sep); }
      const b=document.createElement('button'); b.textContent=s.title;
      b.onclick=()=>{ stack.length=i+1; go(); };
      crumb.appendChild(b);
    });
  }

  async function go(){
    renderCrumbs();
    const cur = stack[stack.length-1];
    body.innerHTML = '<p class="muted">Yuklanmoqda...</p>';
    if(cur.level === 'category'){
      let json;
      try{ json = await api('/mobile/category', {query:{limit:100,page:1}}); }catch(e){ body.innerHTML='<p class="muted">Xatolik</p>'; return; }
      const {items} = extractList(json);
      const grid = document.createElement('div'); grid.className='grid';
      items.forEach(cat=>{
        const c=document.createElement('div'); c.className='card';
        c.innerHTML = '<h4>'+esc(ml(cat.name))+'</h4>';
        c.onclick=()=>{ stack.push({level:'topic', catId:cat.id, title: ml(cat.name)}); go(); };
        grid.appendChild(c);
      });
      body.innerHTML=''; body.appendChild(grid);
    } else if(cur.level === 'topic'){
      let json;
      try{ json = await api('/mobile/topic', {query:{category_id:cur.catId, limit:100,page:1}}); }catch(e){ body.innerHTML='<p class="muted">Xatolik</p>'; return; }
      const {items} = extractList(json);
      const grid = document.createElement('div'); grid.className='grid';
      if(!items.length) grid.innerHTML='<p class="muted">Mavzu topilmadi.</p>';
      items.forEach(t=>{
        const c=document.createElement('div'); c.className='card';
        c.innerHTML = '<h4>'+esc(ml(t.name))+'</h4>';
        c.onclick = ()=>{ stack.push({level:'case', topicId:t.id, title: ml(t.name)}); go(); };
        grid.appendChild(c);
      });
      body.innerHTML=''; body.appendChild(grid);
    } else if(cur.level === 'case'){
      const toolbar = document.createElement('div'); toolbar.className='toolbar';
      const diffSel = document.createElement('select');
      [['','— barcha qiyinlik —'],['easy','Easy'],['medium','Medium'],['hard','Hard']].forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;diffSel.appendChild(o);});
      const searchI = document.createElement('input'); searchI.placeholder='Qidiruv';
      [['Qiyinlik',diffSel],['Qidiruv',searchI]].forEach(([lb,el])=>{
        const f=document.createElement('div'); f.className='field'; const l=document.createElement('label'); l.textContent=lb;
        f.appendChild(l); f.appendChild(el); toolbar.appendChild(f);
      });
      const goBtn=document.createElement('button'); goBtn.textContent='🔍'; goBtn.onclick=loadCases;
      toolbar.appendChild(goBtn);
      body.innerHTML=''; body.appendChild(toolbar);
      const grid = document.createElement('div'); grid.className='grid'; body.appendChild(grid);

      async function loadCases(){
        grid.innerHTML = '<p class="muted">Yuklanmoqda...</p>';
        let json;
        try{ json = await api('/mobile/case', {query:{topic_id:cur.topicId, difficulty:diffSel.value, search:searchI.value, limit:50,page:1}}); }
        catch(e){ grid.innerHTML='<p class="muted">Xatolik</p>'; return; }
        const {items} = extractList(json);
        grid.innerHTML = items.length ? '' : '<p class="muted">Case topilmadi.</p>';
        items.forEach(cs=>{
          const c=document.createElement('div'); c.className='card';
          c.innerHTML = '<h4>'+esc(cs.title)+'</h4><p>'+esc(cs.difficulty)+' · '+esc(cs.patient_age)+' yosh · '+(cs.is_favorite?'⭐':'')+'</p>';
          c.onclick = ()=> showCaseDetail(cs.id);
          grid.appendChild(c);
        });
      }
      loadCases();
    }
  }

  async function showCaseDetail(id){
    let cs;
    try{ cs = await api('/mobile/case/'+id); }catch(e){ return; }
    const overlay = document.createElement('div'); overlay.className='modalOverlay';
    overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
    const modal = document.createElement('div'); modal.className='modal'; modal.style.width='640px';
    modal.innerHTML =
      '<h3>'+esc(cs.title)+'</h3>'+
      '<div class="kv"><div><span class="k">Mavzu</span>'+esc(cs.topic_name)+'</div>'+
      '<div><span class="k">Bo\'lim</span>'+esc(cs.category_name)+'</div>'+
      '<div><span class="k">Qiyinlik</span>'+esc(cs.difficulty)+'</div>'+
      '<div><span class="k">Bemor</span>'+esc(cs.patient_age)+' yosh, '+esc(cs.patient_gender)+'</div>'+
      '<div><span class="k">Shikoyat</span>'+esc(cs.chief_complaint)+'</div>'+
      '<div><span class="k">Kutilgan davomiylik</span>'+esc(cs.expected_duration_minutes)+' min</div>'+
      '<div><span class="k">Status</span>'+esc(cs.status)+'</div></div>';
    const footer = document.createElement('div'); footer.className='modalFooter';
    const favBtn = document.createElement('button'); favBtn.textContent = cs.is_favorite ? '⭐ Sevimlida' : '☆ Sevimliga qo\'shish';
    favBtn.onclick = async ()=>{
      try{ const r = await api('/mobile/favorite', {method:'POST', body:{case_id:cs.id}}); favBtn.textContent = r.is_favorite ? '⭐ Sevimlida' : '☆ Sevimliga qo\'shish'; }catch(e){}
    };
    const startBtn = document.createElement('button'); startBtn.className='primary'; startBtn.textContent='🩺 Simulyatsiyani boshlash';
    startBtn.onclick = async ()=>{
      try{
        const res = await api('/mobile/simulation/start', {method:'POST', body:{case_id:cs.id}});
        overlay.remove();
        openSimulation(res);
      }catch(e){}
    };
    const closeBtn = document.createElement('button'); closeBtn.textContent='Yopish'; closeBtn.onclick=()=>overlay.remove();
    footer.appendChild(favBtn); footer.appendChild(startBtn); footer.appendChild(closeBtn);
    modal.appendChild(footer);
    overlay.appendChild(modal); document.body.appendChild(overlay);
  }

  go();
}

// TTS ovozlar ro'yxati ko'p brauzerda (ayniqsa Chrome) sahifa yuklangandan
// keyin ASINXRON keladi - birinchi getVoices() chaqiruvi bo'sh qaytishi mumkin,
// shu sabab 'voiceschanged' hodisasini ham tinglaymiz.
if('speechSynthesis' in window){
  try{ window.speechSynthesis.onvoiceschanged = () => {}; }catch(e){}
}

// pickUzVoice - o'zbekcha (uz-*) ovoz o'rnatilgan bo'lsa qaytaradi, aks holda null.
function pickUzVoice(){
  try{
    const voices = window.speechSynthesis.getVoices() || [];
    return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('uz')) || null;
  }catch(e){ return null; }
}

// speakText - platforma ovozli funksiyasi: backend audio generatsiya qilmaydi,
// qurilma TTS'idan (window.speechSynthesis) foydalanamiz. sim.muted (🔇/🔊 tugmasi)
// va sim.voiceGlobalEnabled (/mobile/setting/voice - admin killswitch) ikkalasi
// ham yoqilgan bo'lsagina o'qiydi.
function speakText(text, force){
  try{
    // force=true - xabar tegidagi 🔊 tugmasi orqali qo'lda qayta eshitish:
    // bu aniq foydalanuvchi buyrug'i, mute/global sozlamadan qat'i nazar ishlaydi.
    if(!force && (!sim || sim.muted || !sim.voiceGlobalEnabled)) return;
    if(!text || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    // O'zbekcha ovoz ko'p brauzerda (ayniqsa Windows/Linux Chrome, Safari)
    // o'rnatilmagan bo'ladi - forsiy lang='uz-UZ' qo'ysak, ba'zi brauzerlar
    // (Safari) mos ovoz topa olmay UMUMAN JIM QOLADI (xato ham bermaydi).
    // Shu sabab o'zbekcha ovoz topilgandagina lang belgilaymiz, aks holda
    // brauzerning standart ovozi bilan o'qitamiz (aksenti noto'g'ri bo'lsa ham,
    // butunlay jim qolgandan ko'ra yaxshi).
    const uzVoice = pickUzVoice();
    if(uzVoice){ u.voice = uzVoice; u.lang = uzVoice.lang; }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

// blobToBase64 - audio Blob'ni (MediaRecorder chiqishi) backendga yuborish
// uchun raw baza64 stringga aylantiradi (data: prefiksisiz).
function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=> resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// wireVoiceInput - ovozli kiritish: brauzer HECH QANDAY tanib olish/tushunish
// qilmaydi (Web Speech API endi ishlatilmaydi) - faqat MediaRecorder bilan xom
// audio yozib oladi, baza64'ga aylantirib backendga yuboradi. Tushunish (STT)
// va javob (matn+ovoz) TO'LIQ Gemini orqali (service/simulation.go AddEvent) -
// "voice orqali suhbatlashish, brauzer aralashmasin, sof o'zbek tilda" talabi.
function wireVoiceInput(micBtn, msgInput){
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){
    micBtn.title = 'Ovozli kiritish bu brauzerda qo\'llab-quvvatlanmaydi';
    micBtn.onclick = ()=>toast('Bu brauzer mikrofon yozib olishni qo\'llamaydi.', 'err');
    return;
  }

  let mediaRecorder = null;
  let chunks = [];
  let recording = false;

  micBtn.onclick = async ()=>{
    if(recording){ mediaRecorder.stop(); return; }

    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio: true});
    }catch(e){
      toast('Mikrofonga ruxsat berilmadi - brauzer/sayt sozlamalaridan mikrofon ruxsatini yoqing.', 'err');
      return;
    }

    chunks = [];
    const mimeType = ['audio/webm', 'audio/mp4', 'audio/ogg'].find(t => window.MediaRecorder.isTypeSupported?.(t)) || '';
    try{
      mediaRecorder = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
    }catch(e){
      stream.getTracks().forEach(t=>t.stop());
      toast('Ovoz yozgichni ishga tushirib bo\'lmadi: '+e.message, 'err');
      return;
    }

    mediaRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstart = ()=>{
      recording = true;
      micBtn.classList.add('recording');
      micBtn.textContent = '⏺️';
    };
    mediaRecorder.onstop = async ()=>{
      recording = false;
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎤';
      stream.getTracks().forEach(t=>t.stop());

      const blob = new Blob(chunks, {type: mediaRecorder.mimeType || mimeType || 'audio/webm'});
      if(blob.size < 300){
        toast('Hech narsa yozilmadi, qayta urinib ko\'ring.', 'err');
        return;
      }
      const b64 = await blobToBase64(blob);
      msgInput.dataset.pendingAudioB64 = b64;
      msgInput.dataset.pendingAudioMime = blob.type;
      msgInput.value = '🎤 (ovozli xabar yuborilmoqda...)';
      msgInput.dispatchEvent(new Event('voiceresult'));
    };

    try{
      mediaRecorder.start();
    }catch(e){
      stream.getTracks().forEach(t=>t.stop());
      toast('Ovoz yozishni boshlab bo\'lmadi: '+e.message, 'err');
    }
  };
}

// playBase64Audio - backend qaytargan Gemini TTS audio'sini (WAV, baza64)
// o'ynatadi. speakText (brauzer TTS) o'rniga ishlatiladi - faqat Gemini audio
// yo'q/xato bo'lgan holatlarda speakText fallback sifatida qoladi.
function playBase64Audio(audioB64, mimeType, force){
  try{
    // speakText bilan bir xil qoida: sim.muted (🔇/🔊 tugma) va
    // sim.voiceGlobalEnabled (/mobile/setting/voice admin killswitch)
    // ikkalasi ham yoqilgan bo'lsagina o'ynatiladi - force=true bo'lsa
    // (xabar tegidagi 🔊 tugmasi, qo'lda qayta eshitish) bu tekshiruv chetlab o'tiladi.
    if(!force && (!sim || sim.muted || !sim.voiceGlobalEnabled)) return;
    if(!audioB64) return;
    const audio = new Audio('data:'+(mimeType||'audio/wav')+';base64,'+audioB64);
    audio.play().catch(()=>{});
  }catch(e){}
}

// addReplayButton - xabar pufakchasiga (pDiv/fDiv) kichik 🔊 tugma qo'shadi -
// bosilganda o'sha xabar audiosini (Gemini bo'lsa) yoki matnini (brauzer TTS
// fallback) istalgan payt qayta eshittiradi, mute holatidan qat'i nazar.
function addReplayButton(container, text, audioB64, audioMime){
  const btn = document.createElement('button');
  btn.className = 'replayBtn';
  btn.type = 'button';
  btn.title = 'Qayta eshitish';
  btn.textContent = '🔊';
  btn.onclick = (e)=>{
    e.stopPropagation();
    if(audioB64) playBase64Audio(audioB64, audioMime, true);
    else speakText(text, true);
  };
  container.appendChild(btn);
}

function simBeepOnce(){
  try{
    if(!sim || sim.muted) return;
    if(!sim.audioCtx) sim.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = sim.audioCtx;
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.frequency.value = 880; osc.type='sine';
    gain.gain.setValueAtTime(0.06, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.12);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.12);
  }catch(e){}
}
function simSetBeepRate(hr){
  if(!sim) return;
  if(sim.beepInt) clearInterval(sim.beepInt);
  if(sim.muted || !hr || hr<=0) return;
  sim.beepInt = setInterval(simBeepOnce, Math.max(280, 60000/hr));
}

function closeSimView(){
  document.getElementById('simView').classList.remove('show');
  if(sim){
    if(sim.ws) try{ sim.ws.close(); }catch(e){}
    if(sim.timerInt) clearInterval(sim.timerInt);
    if(sim.beepInt) clearInterval(sim.beepInt);
  }
  sim = null;
  state.activeSession = null;
  localStorage.removeItem('tu_active_session');
}

// openSimulation - startRes ({session_id,case_id,time_limit_seconds,initial_vitals,visual_state,ws_url,case_title?})
// yoki oddiy {session_id} (Tarix/Davom ettirish orqali qayta ochilganda) bilan chaqiriladi.
async function openSimulation(startRes){
  sim = {
    sessionId: startRes.session_id,
    caseId: startRes.case_id || null,
    timeLimitSec: startRes.time_limit_seconds || null,
    elapsedSec: 0,
    ws: null, timerInt: null, beepInt: null, audioCtx: null,
    muted: true, voiceGlobalEnabled: false,
  };
  try{ const vs = await api('/mobile/setting/voice', {silent:true}); sim.voiceGlobalEnabled = !!(vs && vs.enabled); }catch(e){}
  state.activeSession = {session_id: sim.sessionId};
  localStorage.setItem('tu_active_session', JSON.stringify(state.activeSession));

  const view = document.getElementById('simView'); view.classList.add('show');
  const topbar = document.getElementById('simTopbar');
  const body = document.getElementById('simBody');
  const picker = document.getElementById('simEventPicker');
  const inputBar = document.getElementById('simInputBar');

  let caseInfo = {title:'Simulyatsiya', difficulty:'', chief_complaint:''};
  if(sim.caseId){
    try{ const c = await api('/mobile/case/'+sim.caseId, {silent:true}); if(c) caseInfo = c; }catch(e){}
  }

  topbar.innerHTML =
    '<div><div class="ttl">'+esc(caseInfo.title||'Simulyatsiya')+'</div><div class="sub">'+esc(caseInfo.difficulty||'')+'</div></div>'+
    '<div style="display:flex;gap:6px">'+
      '<button class="simIconBtn" id="simMuteBtn" title="Ovoz (bip + shikoyat/chatni o\'qib berish)">🔇</button>'+
      '<button class="simIconBtn" id="simResetBtn" title="Qayta boshlash">🔄</button>'+
      '<button class="simIconBtn" id="simExitBtn" title="Chiqish">↩️</button>'+
      '<button class="simIconBtn" id="simFinishBtn" title="Yakunlash">🏁</button>'+
    '</div>';
  document.getElementById('simMuteBtn').onclick = ()=>{
    sim.muted = !sim.muted;
    document.getElementById('simMuteBtn').textContent = sim.muted ? '🔇' : '🔊';
    if(!sim.muted) simBeepOnce();
  };
  document.getElementById('simExitBtn').onclick = ()=>{ closeSimView(); selectTab('home'); };
  document.getElementById('simResetBtn').onclick = async ()=>{
    if(!confirmDialog('Case qayta boshlansinmi? Joriy urinish bekor qilinadi.')) return;
    try{ await api('/mobile/simulation/'+sim.sessionId+'/finish', {method:'PUT', body:{reason:'manual'}, silent:true}); }catch(e){}
    if(sim.caseId){
      try{
        const res = await api('/mobile/simulation/start', {method:'POST', body:{case_id:sim.caseId, duration_minutes: sim.timeLimitSec?Math.round(sim.timeLimitSec/60):0}});
        closeSimView(); openSimulation(res);
      }catch(e){}
    }
  };
  document.getElementById('simFinishBtn').onclick = ()=>finishSimulation('manual');

  body.innerHTML =
    '<div class="statusRow" id="simStatus"><span><span class="dot"></span>Barqaror</span><span id="simHealthPct">100%</span></div>'+
    '<div class="avatarStage">'+
      '<div class="avatarFig" id="simAvatar">'+svgAvatar()+'</div>'+
      '<div class="ecgWrap" id="simEcgWrap">'+svgEcg()+'</div>'+
      '<div class="avatarMeta"><span>Teri: <b id="simSkin">—</b></span><span>SpO2: <b id="simSpo2m">—</b></span><span><b id="simHrm">—</b> bpm</span></div>'+
    '</div>'+
    '<div class="barRow"><div class="lbl"><span>Bemor holati</span><b id="simHealthLbl">100%</b></div><div class="miniBar"><div class="fill" id="simHealthFill" style="width:100%"></div></div></div>'+
    '<div class="barRow"><div class="lbl"><span>Vaqt</span><b id="simTimeLbl">—</b></div><div class="miniBar"><div class="fill" id="simTimeFill" style="width:0%;background:linear-gradient(90deg,var(--doc2),var(--doc1))"></div></div></div>'+
    '<div class="vitalsGrid">'+
      '<div class="vitalCard"><span class="ic">❤️</span><div><div class="v" id="vHr">—</div><div class="l">Yurak urishi (bpm)</div></div></div>'+
      '<div class="vitalCard"><span class="ic">🩸</span><div><div class="v" id="vBp">—</div><div class="l">Qon bosimi</div></div></div>'+
      '<div class="vitalCard"><span class="ic">🫁</span><div><div class="v" id="vSpo2">—</div><div class="l">SpO2</div></div></div>'+
      '<div class="vitalCard"><span class="ic">💨</span><div><div class="v" id="vRr">—</div><div class="l">Nafas olish</div></div></div>'+
    '</div>'+
    '<div class="chatLog" id="simChatLog"></div>';

  const chatLog = document.getElementById('simChatLog');
  const sysMsg = document.createElement('div'); sysMsg.className='msg sys';
  sysMsg.innerHTML = '<b>DASTLABKI HOLAT</b>'+esc(caseInfo.chief_complaint ? ('Bemor shikoyati: '+caseInfo.chief_complaint) : 'Bemor bilan simulyatsiya boshlandi.');
  chatLog.appendChild(sysMsg);
  if(caseInfo.chief_complaint) speakText(caseInfo.chief_complaint);

  ['question','exam','lab','imaging','medication','procedure'].forEach((t,i)=>{
    const b=document.createElement('button'); b.textContent = ({question:'❓ Savol',exam:'🩺 Ko\'rik',lab:'🧪 Tahlil',imaging:'📷 Instrumental',medication:'💊 Dori',procedure:'⚙️ Protsedura'})[t];
    b.dataset.t=t; if(i===0) b.classList.add('active');
    b.onclick=()=>{ picker.querySelectorAll('button').forEach(x=>x.classList.toggle('active', x===b)); };
    picker.appendChild(b);
  });

  inputBar.innerHTML =
    '<button class="round" id="simMicBtn" title="Ovozli (tez kunda)">🎤</button>'+
    '<input id="simMsgInput" placeholder="Javobingiz yoki savolingizni yozing...">'+
    '<button class="round primary" id="simSendBtn" title="Yuborish">➤</button>';
  wireVoiceInput(document.getElementById('simMicBtn'), document.getElementById('simMsgInput'));
  const msgInput = document.getElementById('simMsgInput');
  const sendBtnEl = document.getElementById('simSendBtn');
  const sendMsg = async ()=>{
    const pendingAudioB64 = msgInput.dataset.pendingAudioB64;
    const pendingAudioMime = msgInput.dataset.pendingAudioMime;
    const text = msgInput.value.trim();
    if(!pendingAudioB64 && (!text || sendBtnEl.disabled)) return;
    const type = picker.querySelector('button.active')?.dataset.t || 'question';

    let payload;
    if(pendingAudioB64){
      payload = {audio_base64: pendingAudioB64, audio_mime: pendingAudioMime};
      delete msgInput.dataset.pendingAudioB64;
      delete msgInput.dataset.pendingAudioMime;
    } else {
      payload = type === 'question' ? {question:text} : {text};
    }

    const doctorDiv = document.createElement('div'); doctorDiv.className='msg doctor';
    // Matn alohida span'da - transkripsiya kelgach faqat shu yangilanadi,
    // pastda qo'shiladigan 🔊 (o'z ovozini qayta eshitish) tugmasi saqlanib qoladi.
    const doctorTextSpan = document.createElement('span');
    doctorTextSpan.textContent = pendingAudioB64 ? '🎤 ...' : text;
    doctorDiv.appendChild(doctorTextSpan);
    if(pendingAudioB64){
      // Shifokorning o'zi aytgan ovozli xabari - Gemini javobidan mustaqil,
      // o'zi yozib olgan xom audio (pendingAudioB64) orqali istalgan payt
      // qayta eshitib ko'rish mumkin.
      addReplayButton(doctorDiv, null, pendingAudioB64, pendingAudioMime);
    }
    chatLog.appendChild(doctorDiv); msgInput.value=''; chatLog.scrollTop = chatLog.scrollHeight;

    // "Yozayapti..." indikatori - Gemini javobi 1-3 soniya kutilishi mumkin,
    // shu vaqt oralig'ida chat "muzlab qolgandek" ko'rinmasin uchun.
    msgInput.disabled = true; sendBtnEl.disabled = true;
    const typingDiv = document.createElement('div'); typingDiv.className = 'msg patient typing';
    typingDiv.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    chatLog.appendChild(typingDiv); chatLog.scrollTop = chatLog.scrollHeight;

    try{
      const res = await api('/mobile/simulation/'+sim.sessionId+'/event', {method:'POST', body:{session_id:sim.sessionId, type, payload}});
      typingDiv.remove();

      // Ovozli xabar bo'lsa, Gemini transkripsiyasi kelgach "🎤 ..." o'rniga
      // haqiqatan nima deyilganini ko'rsatamiz.
      if(pendingAudioB64 && res.response && res.response.transcript){
        doctorTextSpan.textContent = res.response.transcript;
      } else if(pendingAudioB64 && res.response && res.response.transcribe_error){
        doctorTextSpan.textContent = '🎤 (tushunilmadi)';
      }

      // replyAudio - Gemini native TTS (o'zbekcha, backend/service/simulation.go
      // Synthesize) - brauzer TTS o'rniga shu o'ynatiladi. Topilmasa (AI xato/
      // o'chirilgan) brauzer TTS'ga (speakText) tushamiz - butunlay jim qolmasin.
      const replyAudio = res.response && res.response.reply_audio_base64;
      const playReply = (text)=>{
        if(replyAudio) playBase64Audio(replyAudio, res.response.reply_audio_mime);
        else speakText(text);
      };

      if(res.response && res.response.patient_reply){
        const pDiv = document.createElement('div'); pDiv.className='msg patient'; pDiv.textContent = res.response.patient_reply;
        addReplayButton(pDiv, res.response.patient_reply, replyAudio, res.response.reply_audio_mime);
        chatLog.appendChild(pDiv);
        playReply(res.response.patient_reply);
      } else if(res.response && res.response.patient_reply_error){
        const eDiv = document.createElement('div'); eDiv.className='msg err'; eDiv.textContent = 'AI javob bera olmadi: '+res.response.patient_reply_error;
        chatLog.appendChild(eDiv);
      } else if(res.response && res.response.feedback){
        // ActionEvaluatorAI klinik bahosi (ko'rik/tahlil/dori/protsedura) - to'g'ri/noto'g'ri + qisqa izoh + sog'liq o'zgarishi.
        const fDiv = document.createElement('div'); fDiv.className='msg ' + (res.is_correct?'patient':'err');
        const sign = res.health_delta > 0 ? '+' : '';
        fDiv.innerHTML = (res.is_correct?'✅ ':'⚠️ ')+esc(res.response.feedback)+' <span class="muted">('+sign+res.health_delta+'% sog\'liq)</span>';
        addReplayButton(fDiv, res.response.feedback, replyAudio, res.response.reply_audio_mime);
        chatLog.appendChild(fDiv);
        playReply(res.response.feedback);
      } else if(res.response && res.response.feedback_error){
        const eDiv = document.createElement('div'); eDiv.className='msg err'; eDiv.textContent = 'AI baho bera olmadi: '+res.response.feedback_error;
        chatLog.appendChild(eDiv);
      } else {
        const iDiv = document.createElement('div'); iDiv.className='msg sys'; iDiv.textContent = (res.is_correct?'✅ ':'❌ ')+'health_delta: '+res.health_delta;
        chatLog.appendChild(iDiv);
      }
      chatLog.scrollTop = chatLog.scrollHeight;
      applyHealth(res.health_percent);
      // Backend health_percent 0'ga tushganda sessiyani O'ZI avtomatik
      // yakunlaydi (session_ended/finish_result) - shu natijadan foydalanamiz,
      // qayta PUT /finish chaqirmaymiz (allaqachon yakunlangan sessiyaga
      // urinib, kerakssiz xato qaytarardi).
      if(res.session_ended){ completeSimulationFlow(sim.sessionId, res.finish_result); }
    }catch(e){
      typingDiv.remove();
    } finally {
      msgInput.disabled = false; sendBtnEl.disabled = false; msgInput.focus();
    }
  };
  sendBtnEl.onclick = sendMsg;
  msgInput.addEventListener('keydown', e=>{ if(e.key==='Enter') sendMsg(); });
  // wireVoiceInput matnni to'ldirib shu hodisani otadi - ovozdan darhol yuboriladi.
  msgInput.addEventListener('voiceresult', sendMsg);

  // Timer (faqat yangi Start'da bor - resume qilinganda ko'rsatilmaydi)
  if(sim.timeLimitSec){
    document.getElementById('simTimeLbl').textContent = fmtMMSS(sim.timeLimitSec);
    sim.timerInt = setInterval(()=>{
      sim.elapsedSec++;
      const remain = Math.max(0, sim.timeLimitSec - sim.elapsedSec);
      document.getElementById('simTimeLbl').textContent = fmtMMSS(remain);
      document.getElementById('simTimeFill').style.width = Math.min(100, (sim.elapsedSec/sim.timeLimitSec)*100)+'%';
      if(remain<=0){ clearInterval(sim.timerInt); finishSimulation('timeout'); }
    }, 1000);
  } else {
    document.getElementById('simTimeLbl').textContent = 'davom etmoqda';
  }

  applyHealth(startRes.health_percent ?? 100);
  if(startRes.initial_vitals) applyVitals(startRes.initial_vitals, '');

  // WS - real-vaqt vitallar (token query orqali, browser WS header qo'sha olmasligi tuzatildi)
  try{
    const wsPath = startRes.ws_url || ('/mobile/simulation/'+sim.sessionId+'/ws');
    const wsUrl = state.baseUrl.replace(/^http/,'ws') + wsPath + '?token=' + encodeURIComponent(state.access);
    const ws = new WebSocket(wsUrl);
    sim.ws = ws;
    ws.onmessage = (ev)=>{
      let data; try{ data = JSON.parse(ev.data); }catch(e){ return; }
      if(!sim) return;
      if(typeof data.health_percent === 'number') applyHealth(data.health_percent);
      if(data.vitals) applyVitals(data.vitals, data.alarm||'');
    };
  }catch(e){}
}

function fmtMMSS(sec){ sec=Math.max(0,Math.round(sec)); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }

function applyHealth(pct){
  pct = Math.max(0, Math.min(100, Math.round(pct ?? 100)));
  const fill = document.getElementById('simHealthFill'); if(fill) fill.style.width = pct+'%';
  const lbl = document.getElementById('simHealthLbl'); if(lbl) lbl.textContent = pct+'%';
  const pctEl = document.getElementById('simHealthPct'); if(pctEl) pctEl.textContent = pct+'%';
  if(sim) sim.lastHealthPct = pct;
  refreshAvatarSeverity();
}

// refreshAvatarSeverity - avatar ko'rinishini (yuz/nafas) ikkita signaldan
// eng og'irini olib belgilaydi: backend alarm (warning>=65% dan pastda,
// critical>=70% pasaysa ishga tushadi - bu ECG/teri/status matniga ham
// ta'sir qiladi) VA health_percent'ning o'zi. Faqat alarm'ga qarasa, masalan
// 70% (hali "Barqaror") bilan 66% orasida bemor tashqi ko'rinishda umuman
// o'zgarmagan bo'lib qolardi - health tushayotganini avatar erta ko'rsatsin
// deb frontend o'z chegarasini (<=80% mid, <=40% high) ham qo'shadi.
function refreshAvatarSeverity(){
  const avatar = document.getElementById('simAvatar');
  if(!avatar || !sim) return;
  const pct = sim.lastHealthPct ?? 100;
  const alarm = sim.lastAlarm || '';

  if(alarm === 'flatline'){ avatar.className = 'avatarFig flatline'; return; }

  let level = '';
  if(alarm === 'critical' || pct <= 40) level = 'high';
  else if(alarm === 'warning' || pct <= 80) level = 'mid';

  avatar.className = 'avatarFig' + (level ? ' severity-'+level : '');
}

function applyVitals(v, alarm){
  const set = (id,val)=>{ const el=document.getElementById(id); if(el) el.textContent = val; };
  set('vHr', (v.hr??'—')); set('vBp', v.bp||'—'); set('vSpo2', (v.spo2!=null?v.spo2+'%':'—')); set('vRr', (v.rr??'—'));
  set('simHrm', v.hr??'—'); set('simSpo2m', v.spo2!=null?v.spo2+'%':'—');
  set('simSkin', alarm==='critical'||alarm==='flatline' ? 'Rangpar' : (alarm==='warning' ? 'Nam' : 'Normal'));

  const statusRow = document.getElementById('simStatus');
  const ecgWrap = document.getElementById('simEcgWrap');
  if(statusRow){
    statusRow.className = 'statusRow' + (alarm?(' '+(alarm==='flatline'?'flat':alarm)):'');
    const label = {warning:'Og\'riqda', critical:'Og\'ir holat', flatline:'YURAK TO\'XTADI', '':'Barqaror'}[alarm||''];
    statusRow.querySelector('span').innerHTML = '<span class="dot"></span>'+esc(label);
  }
  if(sim) sim.lastAlarm = alarm || '';
  refreshAvatarSeverity();
  if(ecgWrap) ecgWrap.classList.toggle('flat', alarm==='flatline');
  if(v.hr) simSetBeepRate(v.hr);
}

async function finishSimulation(reason){
  if(!sim) return;
  const sid = sim.sessionId;
  let finishRes = null;
  try{
    finishRes = await api('/mobile/simulation/'+sid+'/finish', {method:'PUT', body:{reason}});
  }catch(e){}
  completeSimulationFlow(sid, finishRes);
}

// completeSimulationFlow - Finish natijasi (qo'lda "Yakunlash" bosilib PUT
// /finish orqali, YOKI backend health_percent 0'da avtomatik yakunlab shu
// natijani AddEvent javobida qaytarganda) bir xil yakuniy oqim: ball/XP/tanga
// toast, sim view yopiladi, debrief kutiladi.
function completeSimulationFlow(sessionId, finishRes){
  if(finishRes){
    toast('Yakunlandi. Ball: '+finishRes.final_score+' · XP: +'+finishRes.xp_earned+' · Tanga: +'+finishRes.coins_earned, 'ok');
  }
  closeSimView();
  selectTab('home');
  awaitDebrief(sessionId);
}

// awaitDebrief - Finish chaqirilgach debriefing hisoboti fonda (Gemini orqali)
// tayyorlanadi - shu sabab bir martalik so'rov ko'pincha 400 qaytaradi ("hali
// tayyor emas"). Tayyor bo'lguncha jim (silent) qayta-qayta so'raymiz.
async function awaitDebrief(sessionId, attempt){
  attempt = attempt || 0;
  if(attempt === 0) toast('⏳ Hisobot (debrief) tayyorlanmoqda...', 'ok');
  let d;
  try{ d = await api('/mobile/debrief/'+sessionId, {silent:true}); }catch(e){ d = null; }
  if(d){ showDebriefData(d); return; }
  if(attempt >= 9){ toast('Hisobot hali tayyor emas - Profil → Tarix bo\'limidan keyinroq ko\'ring.', 'err'); return; }
  setTimeout(()=>awaitDebrief(sessionId, attempt+1), 2000);
}

async function showDebrief(sessionId){
  let d;
  try{ d = await api('/mobile/debrief/'+sessionId); }catch(e){ return; }
  showDebriefData(d);
}

function showDebriefData(d){
  const overlay = document.createElement('div'); overlay.className='modalOverlay';
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  const modal = document.createElement('div'); modal.className='modal'; modal.style.width='640px';
  modal.innerHTML = '<h3>📋 Debriefing hisoboti</h3>'+
    '<div class="kv">'+
    '<div><span class="k">Yakuniy ball</span>'+esc(d.final_score)+'</div>'+
    '<div><span class="k">XP</span>'+esc(d.xp_earned)+'</div>'+
    '<div><span class="k">Coins</span>'+esc(d.coins_earned)+'</div>'+
    '<div><span class="k">To\'g\'ri qadamlar</span>'+esc((d.correct_steps||[]).join(', ')||'—')+'</div>'+
    '<div><span class="k">Noto\'g\'ri qadamlar</span>'+esc((d.incorrect_steps||[]).join(', ')||'—')+'</div>'+
    '<div><span class="k">Zaif mavzular</span>'+esc((d.weak_topics||[]).join(', ')||'—')+'</div>'+
    '<div><span class="k">Guideline izoh</span>'+esc(d.guideline_notes||'—')+'</div>'+
    '</div>';
  const footer = document.createElement('div'); footer.className='modalFooter';
  const closeBtn = document.createElement('button'); closeBtn.textContent='Yopish'; closeBtn.onclick=()=>overlay.remove();
  footer.appendChild(closeBtn); modal.appendChild(footer);
  overlay.appendChild(modal); document.body.appendChild(overlay);
}

/* ============================================================
   TARIFFS / SUBSCRIPTION
   ============================================================ */
async function renderTariffs(main){
  main.innerHTML = '<p class="pageDesc">/mobile/tariff, /mobile/subscription</p>';
  const grid = document.createElement('div'); grid.className='grid'; main.appendChild(grid);
  let json;
  try{ json = await api('/mobile/tariff'); }catch(e){ grid.innerHTML='<p class="muted">Xatolik</p>'; return; }
  const {items} = extractList(json);
  grid.innerHTML = items.length ? '' : '<p class="muted">Tarif topilmadi.</p>';
  items.forEach(t=>{
    const c = document.createElement('div'); c.className='card stat';
    const isCoinPkg = t.kind === 'coin_package';
    const subtitle = isCoinPkg ? ('🪙 '+esc(t.coins)+' tanga · '+esc(t.price)+' so\'m') : (esc(t.duration)+' oy · '+esc(t.price)+' so\'m');
    c.innerHTML = '<h4>'+esc(t.name)+(isCoinPkg?' <span class="muted">(tanga paketi)</span>':'')+'</h4><p>'+subtitle+'</p><p class="muted">'+esc(t.description||'')+'</p>';
    const buyRow = document.createElement('div'); buyRow.style.display='flex'; buyRow.style.gap='6px'; buyRow.style.marginTop='8px';
    const coinsInp = document.createElement('input'); coinsInp.type='number'; coinsInp.placeholder='Tanga (ixtiyoriy)'; coinsInp.style.width='100%';
    if(isCoinPkg) coinsInp.style.display='none'; // tangaga tanga sotib olib bo'lmaydi
    const buyBtn = document.createElement('button'); buyBtn.className='primary'; buyBtn.textContent='💳 Sotib olish';
    buyBtn.onclick = async ()=>{
      try{
        const res = await api('/mobile/subscription', {method:'POST', body:{tariff_id:t.id, coins_used:Number(coinsInp.value||0)}});
        if(res.just_paid) toast(isCoinPkg ? 'Tangalar hisobga qo\'shildi!' : 'To\'liq tangadan to\'landi — obuna faollashdi!', 'ok');
        else if(res.url) openPayLink(res.url);
        else toast('Buyurtma yaratildi: '+res.order_id, 'ok');
      }catch(e){}
    };
    buyRow.appendChild(coinsInp); buyRow.appendChild(buyBtn);
    c.appendChild(buyRow);
    grid.appendChild(c);
  });
}
function openPayLink(url){
  openModal({
    title:'To\'lov havolasi',
    fields:[{name:'url', label:'URL', type:'text', full:true}],
    values:{url},
    submitLabel:'Yopish',
    onSubmit: async ()=>{},
  });
}

/* ============================================================
   TOP PROFILE HEADER (home/keys/profil sahifalarida umumiy)
   ============================================================ */
async function renderTopProfile(){
  const box = document.getElementById('topProfile');
  let me, limit, levels;
  try{ me = await api('/mobile/user/get/profile', {silent:true}); }catch(e){ me = {}; }
  try{ limit = await api('/mobile/user/limit', {silent:true}); }catch(e){ limit = null; }
  try{ const r = await api('/mobile/level', {silent:true}); levels = extractList(r).items; }catch(e){ levels = []; }

  const xp = me.xp ?? 0;
  const next = (levels||[]).map(l=>l.required_xp).filter(v=>typeof v==='number' && v>xp).sort((a,b)=>a-b)[0];
  const xpLabel = next ? (xp+'/'+next+' XP') : (xp+' XP');
  const initial = (me.name||'?').trim().charAt(0).toUpperCase() || '?';

  let limitHtml = '';
  if(limit){
    limitHtml = limit.has_subscription
      ? '<span class="statPill limit">⭐ Premium</span>'
      : '<span class="statPill limit">🛡 '+esc(limit.remaining)+'/'+esc(limit.total)+' Limit</span>';
  }

  box.innerHTML =
    '<div class="who">'+
      '<div class="avatarCircle">'+esc(initial)+'</div>'+
      '<div><div class="name">'+esc(me.name||'Foydalanuvchi')+' <span class="lvlPill">Lvl '+esc(me.level??1)+'</span></div>'+
      '<div class="sub">🔥 '+esc(me.streak_count??0)+' kun · '+esc(xpLabel)+'</div></div>'+
    '</div>'+
    '<div class="topRight">'+
      '<span class="statPill coins">🪙 '+esc(me.coins??0)+'</span>'+
      limitHtml+
    '</div>';
}

/* ============================================================
   BOTTOM NAV / SHELL BOOT
   ============================================================ */
const BOTTOM_NAV = [
  {key:'home', icon:'✨', label:'Bosh sahifa'},
  {key:'keys', icon:'📁', label:'Keyslar'},
  {key:'profile', icon:'👤', label:'Profil'},
];

function buildBottomNav(){
  const nav = document.getElementById('bottomNav');
  nav.innerHTML = '';
  BOTTOM_NAV.forEach(item=>{
    const b = document.createElement('button'); b.dataset.key = item.key;
    b.innerHTML = '<span class="ic">'+item.icon+'</span><span>'+esc(item.label)+'</span>';
    b.onclick = ()=>selectTab(item.key);
    nav.appendChild(b);
  });
}

function selectTab(key){
  state.currentTab = key;
  document.querySelectorAll('#bottomNav button').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  const homeView = document.getElementById('homeView');
  const main = document.getElementById('main');
  if(key === 'home'){
    homeView.style.display = ''; main.style.display = 'none';
    renderHomeNew();
  } else {
    homeView.style.display = 'none'; main.style.display = '';
    if(key === 'keys') renderCatalog();
    else if(key === 'profile') renderProfile();
  }
  renderTopProfile();
}

function startApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('shell').classList.add('show');
  buildBottomNav();
  selectTab('home');
}

(function boot(){
  document.getElementById('baseUrlInput').value = state.baseUrl;
  if(state.access) startApp();
})();
