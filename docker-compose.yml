version: '3.9'

services:
  migrate-road:
    image: ghcr.io/kukymbr/goose-docker:3.23.0
    environment:
      - GOOSE_DRIVER=postgres
      - GOOSE_DBSTRING=host=postgres-tibsphereai port=5432 user=postgres password=${POSTGRES_PASSWORD} dbname=${POSTGRES_NAME} sslmode=disable
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres-tibsphereai:
        condition: service_healthy
    networks:
      - tibsphereai

  postgres-tibsphereai:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /data/postgres
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - tibsphereai_postgres_data:/var/lib/postgres/data
    ports:
      - "127.0.0.1:${HOST_POSTGRES_PORT}:5432"
    networks:
      - tibsphereai
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  tibsphereai:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_APP_PORT}:8004"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - AUTH_PORT=:8004
      - POSTGRES_HOST=postgres-tibsphereai
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis-tibsphereai
      - REDIS_PORT=:6379
      - MINIO_ENDPOINT=minio-tibsphereai
      - MINIO_PORT=:9010
    depends_on:
      - postgres-tibsphereai
      - redis-tibsphereai
    volumes:
      - ./internal/secrets:/app/internal/secrets:ro
    networks:
      - tibsphereai

  redis-tibsphereai:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_REDIS_PORT}:6379"
    networks:
      - tibsphereai

  minio-tibsphereai:
    image: quay.io/minio/minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${HOST_MINIO_PORT}:9010"
      - "127.0.0.1:${HOST_MINIO_CONSOLE_PORT}:9011"
    command: server /data --address ":9010" --console-address ":9011"
    volumes:
      - tibsphereai_minio_data:/data
    networks:
      - tibsphereai

networks:
  tibsphereai:
    driver: bridge

volumes:
  tibsphereai_postgres_data:
  tibsphereai_minio_data:
