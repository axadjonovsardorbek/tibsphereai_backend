info:
  contact: {}
  description: API for MedicAI clinical simulation platform
  title: MedicAI API
  version: "1.0"
paths:
  /auth/token/refresh:
    post:
      consumes:
      - application/json
      description: Middleware "access token expired" (401) qaytarganda shu endpoint
        orqali yangi access+refresh token juftini oling
      parameters:
      - description: refresh_token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.RefreshTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TokenRes'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Access token'ni refresh_token orqali yangilash
      tags:
      - auth
  /inpay/callback:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: inPAY webhook (imzosiz; holat inPAY API orqali qayta tekshiriladi)
      tags:
      - payment
  /mobile/about:
    get:
      consumes:
      - application/json
      description: Get all about with optional filtering
      parameters:
      - description: Title
        in: query
        name: title
        type: string
      - default: uz
        description: Language (uz|ru|en)
        in: header
        name: Accept-Language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AboutMobileList'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get all about
      tags:
      - about
  /mobile/about/{id}:
    get:
