  /mobile/auth/google:
    post:
      consumes:
      - application/json
      description: 'BACKEND_STRUCTURE.md 1-bo''lim: Google ID token orqali bir bosqichli
        kirish'
      parameters:
      - description: Google ID token
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.GoogleLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TokenRes'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Google orqali kirish (1 bosqichli)
      tags:
      - auth
  /mobile/auth/telegram/check:
    post:
      consumes:
      - application/json
      description: |-
        status=pending - kutish; status=confirmed - auth ichida access/refresh tokenlar (token bir martalik).
        Token yo'q/muddati o'tgan bo'lsa 400 otp_expired.
      parameters:
      - description: '{token, referral_code?}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.TelegramLinkCheckRes'
      summary: Telegram orqali kirish natijasini tekshirish (poll)
      tags:
      - auth
  /mobile/auth/telegram/start:
    post:
      description: |-
        Ilova bot_url'ni ochadi; foydalanuvchi botda (bir marta raqamini yuborib) tasdiqlaydi.
        Ilova /mobile/auth/telegram/check ni 2 soniyada bir poll qiladi. Captcha yoqilgan bo'lsa X-Captcha-Token header kerak.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.TelegramLinkStartRes'
      summary: Telegram bot orqali OTP'siz kirishni boshlash (token + bot havolasi)
      tags:
      - auth
  /mobile/auth/user/check:
    post:
      consumes:
      - application/json
      description: Check user
      parameters:
      - description: User check credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.UserCheckReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserCheckRes'
        "400":
          description: Invalid request payload
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      summary: Check user
      tags:
      - auth
  /mobile/auth/user/otp/confirm:
